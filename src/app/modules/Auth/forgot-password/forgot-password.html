<div class="forgot-password-header">
  <h2>Forgot Password</h2>
  <p>Enter your email to reset your password</p>
</div>
<div class="forgot-password-container">
  <div class="forgot-password-visual">
    <img src="assets/images/RIDGED.png" alt="Ridged text background" class="ridged-bg" />
    <img src="assets/images/10.png" alt="Ridged Energy Drink" class="can-image" />
  </div>
  <div class="forgot-password-card">
    <form class="forgot-password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Email -->
      <div class="form-field">
        <label for="Email">Email</label>
        <p-iconfield iconPosition="left">
          <p-inputicon styleClass="pi pi-envelope" />
          <input pInputText type="text" formControlName="Email" id="email" type="email" placeholder="Enter your email"
            styleClass="w-full" />
        </p-iconfield>
        <!-- Error messages -->
        <small class="error-message" *ngIf="forgotPasswordForm.get('Email')?.touched">
          {{getErrorMessage('Email')}}
        </small>
      </div>

      <!-- Submit Button -->
      <p-button type="submit" label="Send Reset Link" icon="pi pi-send" styleClass="w-full" [raised]="true"
        [disabled]="forgotPasswordForm.invalid || isLoading">
      </p-button>

      <!-- Back to Login Link -->
      <div class="back-to-login-link">
        Remember your password? <a routerLink="/login">Sign In</a>
      </div>
    </form>
  </div>
</div>
